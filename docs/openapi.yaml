openapi: 3.1.0
info:
  title: Page Media Saver API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:38542/v1
paths:
  /status:
    get:
      summary: Read queue and platform worker status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue status, including worker back-off for every platform.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptimeSeconds:
                    type: number
                  platforms:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PlatformStatus"
  /metrics:
    get:
      summary: Read Prometheus metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PlatformStatus:
      type: object
      required: [configuredWorkers, effectiveWorkers, backoffUntil, backoffLevel]
      properties:
        configuredWorkers:
          type: integer
          minimum: 1
          maximum: 8
        effectiveWorkers:
          type: integer
          minimum: 1
          maximum: 8
        backoffUntil:
          type: [string, "null"]
          format: date-time
        backoffLevel:
          type: integer
          minimum: 0
